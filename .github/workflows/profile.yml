name: Generate profile animations

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Monthly activity chart
        run: python3 scripts/activity.py dist/activity.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}

      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#A66BFF&color_dots=#ebedf0,#54A0FF,#1DD1A1,#FECA57,#FF5C5C
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#A66BFF&color_dots=#161b22,#54A0FF,#1DD1A1,#FECA57,#FF5C5C

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
